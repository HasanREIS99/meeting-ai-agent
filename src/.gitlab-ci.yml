# GitLab CI/CD Pipeline — Meeting Transcript Analyzer
# Stages: lint → test → build → deploy

stages:
  - lint
  - test
  - build
  - deploy

variables:
  APP_NAME: meeting-transcript-analyzer
  APP_IMAGE: registry.gitlab.adesso-group.com/meeting-ai-agent/${APP_NAME}

# ── Lint ───────────────────────────────────────────────────────────

lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir ruff mypy
  script:
    - cd src
    - ruff check meeting_analyzer/
    - mypy meeting_analyzer/
  rules:
    - when: always

# ── Test ────────────────────────────────────────────────────────────

test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
  script:
    - cd src
    - pytest tests/ -v --cov=meeting_analyzer --cov-report=xml --cov-report=term-missing
  coverage: '/TOTAL.+?(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: src/coverage.xml
  rules:
    - when: on_success

# ── Build ───────────────────────────────────────────────────────────

build:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd src
    - docker build -t ${APP_IMAGE}:${CI_COMMIT_SHORT_SHA} .
    - docker tag ${APP_IMAGE}:${CI_COMMIT_SHORT_SHA} ${APP_IMAGE}:latest
    - docker push ${APP_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - docker push ${APP_IMAGE}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── Deploy ──────────────────────────────────────────────────────────

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker
  script:
    - echo "Deploying ${APP_IMAGE}:${CI_COMMIT_SHORT_SHA} to internal VM"
    - |
      ssh $DEPLOY_HOST "cd /opt/${APP_NAME} && \
        docker pull ${APP_IMAGE}:${CI_COMMIT_SHORT_SHA} && \
        docker compose down && \
        docker compose up -d"
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  environment:
    name: production
