# Nginx reverse proxy configuration for Meeting Transcript Analyzer
#
# This config terminates TLS (NFR-S-003: TLS 1.2+) and forwards
# requests to the FastAPI backend.  It also adds secure headers
# recommended by OWASP.
#
# Place this file in /etc/nginx/conf.d/meeting-transcript-analyzer.conf
# on the deployment server and reload nginx after updating env vars.

# ── Upstream backend ──────────────────────────────────────────────

upstream meeting_analyzer_backend {
    server 127.0.0.1:8000;  # FastAPI runs on localhost in Docker
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────

server {
    listen 80;
    server_name ${NGINX_SERVER_NAME:-localhost};

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# ── HTTPS server ─────────────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name ${NGINX_SERVER_NAME:-localhost};

    # ── TLS 1.2+ (NFR-S-003) ────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_certificate     /etc/ssl/certs/${NGINX_SSL_CERT:-meeting-analyzer.crt};
    ssl_certificate_key /etc/ssl/private/${NGINX_SSL_KEY:-meeting-analyzer.key};

    # ── Security headers (NFR-S-004) ────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;

    # ── Timeouts ──────────────────────────────────────────────────
    proxy_read_timeout 300s;      # LLM calls can be slow
    proxy_send_timeout 300s;
    connect_timeout 10s;

    # ── Buffering ─────────────────────────────────────────────────
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;

    # ── Forward original client info ──────────────────────────────
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── API routes ────────────────────────────────────────────────
    location /api/ {
        client_max_body_size 10m;  # Allow uploads up to 10 MB
        proxy_pass http://meeting_analyzer_backend;
    }

    # ── Frontend static assets ────────────────────────────────────
    location /static/ {
        proxy_pass http://meeting_analyzer_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Frontend pages ────────────────────────────────────────────
    location / {
        proxy_pass http://meeting_analyzer_backend;
    }
}
